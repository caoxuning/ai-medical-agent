<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗问诊 Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            padding: 0;
            margin: 0;
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #333;
        }
        
        .sidebar-header h3 {
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .new-chat-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        
        .new-chat-btn:hover {
            opacity: 0.9;
        }
        
        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .session-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }
        
        .session-item:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .session-item.active {
            background: rgba(102, 126, 234, 0.3);
        }
        
        .session-title {
            font-size: 14px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .session-time {
            font-size: 12px;
            color: #888;
        }
        
        .session-delete {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .session-item:hover .session-delete {
            opacity: 1;
        }
        
        .session-delete:hover {
            color: #ff4444;
        }
        
        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid #333;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
        
        .toggle-sidebar {
            display: none;
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        
        .chat-container {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin: 0 10px;
            flex-shrink: 0;
        }
        
        .message.user .avatar {
            background: #667eea;
        }
        
        .message.assistant .avatar {
            background: #764ba2;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .message-content pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 10px;
        }
        
        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        
        .chat-input-wrapper {
            display: flex;
            gap: 10px;
        }
        
        #user-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #user-input:focus {
            border-color: #667eea;
        }
        
        #send-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        #send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .typing-indicator {
            display: none;
            padding: 10px 20px;
            color: #666;
            font-style: italic;
        }
        
        .typing-indicator.show {
            display: block;
        }
        
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        
        .welcome-message h2 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .welcome-message p {
            margin-bottom: 20px;
        }
        
        .example-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        
        .example-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .example-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>💬 会话历史</h3>
            <button onclick="createNewSession()" class="new-chat-btn">+ 新对话</button>
        </div>
        <div class="session-list" id="session-list">
            <!-- 会话列表将在这里动态生成 -->
        </div>
        <div class="sidebar-footer">
            <p>基于 ReAct + 80万+ 医学知识</p>
        </div>
    </div>
    
    <div class="chat-container">
        <div class="chat-header">
            <h1>🏥 医疗问诊 Agent</h1>
            <p>基于 ReAct 架构 + 80万+ 医学知识库</p>
            <button onclick="toggleSidebar()" class="toggle-sidebar">☰</button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="welcome-message">
                <h2>👋 您好！我是您的医疗问诊助手</h2>
                <p>请描述您的症状，我会帮您分析并给出建议</p>
                <div class="example-questions">
                    <button class="example-btn" onclick="setInput('我最近头疼，已经持续三天了')">头疼</button>
                    <button class="example-btn" onclick="setInput('我高血压能吃党参吗')">高血压</button>
                    <button class="example-btn" onclick="setInput('心力衰竭怎么护理')">心衰护理</button>
                    <button class="example-btn" onclick="setInput('感冒发烧怎么办')">感冒发烧</button>
                </div>
            </div>
        </div>
        
        <div class="error-message" id="error-message"></div>
        
        <div class="typing-indicator" id="typing-indicator">
            🤖 医生正在思考...
        </div>
        
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="请描述您的症状..." 
                    autocomplete="off"
                >
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // 会话管理
        let sessionId = localStorage.getItem('current_session') || 'user_' + Date.now();
        const API_URL = 'http://localhost:5000/api/chat';
        const SESSIONS_URL = 'http://localhost:5000/api/sessions';
        
        // 页面加载时恢复会话或加载历史
        window.onload = function() {
            loadSessions();
            loadSessionHistory();
            userInput.focus();
        };
        
        // 加载会话列表
        async function loadSessions() {
            try {
                const response = await fetch(SESSIONS_URL);
                const data = await response.json();
                
                const sessionList = document.getElementById('session-list');
                sessionList.innerHTML = '';
                
                if (data.sessions) {
                    data.sessions.forEach(session => {
                        const item = document.createElement('div');
                        item.className = 'session-item' + (session.session_id === sessionId ? ' active' : '');
                        item.innerHTML = `
                            <div class="session-title">会话 ${session.session_id.slice(-6)}</div>
                            <div class="session-time">${formatTime(session.updated_at)} · ${session.message_count} 条消息</div>
                            <button class="session-delete" onclick="event.stopPropagation(); deleteSession('${session.session_id}')">×</button>
                        `;
                        item.onclick = () => switchSession(session.session_id);
                        sessionList.appendChild(item);
                    });
                }
            } catch (e) {
                console.error('加载会话列表失败:', e);
            }
        }
        
        // 加载会话历史
        async function loadSessionHistory() {
            try {
                const response = await fetch(`${SESSIONS_URL}/${sessionId}`);
                if (response.ok) {
                    const data = await response.json();
                    
                    // 清空当前消息
                    chatMessages.innerHTML = '';
                    
                    // 恢复消息
                    if (data.messages) {
                        data.messages.forEach(msg => {
                            addMessage(msg.role, msg.content);
                        });
                    }
                }
            } catch (e) {
                console.log('加载会话历史失败，可能是新会话');
            }
        }
        
        // 切换会话
        function switchSession(newSessionId) {
            sessionId = newSessionId;
            localStorage.setItem('current_session', sessionId);
            loadSessions();
            loadSessionHistory();
        }
        
        // 创建新会话
        function createNewSession() {
            sessionId = 'user_' + Date.now();
            localStorage.setItem('current_session', sessionId);
            chatMessages.innerHTML = `
                <div class="welcome-message">
                    <h2>👋 您好！我是您的医疗问诊助手</h2>
                    <p>请描述您的症状，我会帮您分析并给出建议</p>
                    <div class="example-questions">
                        <button class="example-btn" onclick="setInput('我最近头疼，已经持续三天了')">头疼</button>
                        <button class="example-btn" onclick="setInput('我高血压能吃党参吗')">高血压</button>
                        <button class="example-btn" onclick="setInput('心力衰竭怎么护理')">心衰护理</button>
                        <button class="example-btn" onclick="setInput('感冒发烧怎么办')">感冒发烧</button>
                    </div>
                </div>
            `;
            loadSessions();
        }
        
        // 删除会话
        async function deleteSession(id) {
            if (!confirm('确定要删除这个会话吗？')) return;
            
            try {
                await fetch(`${SESSIONS_URL}/${id}`, { method: 'DELETE' });
                if (id === sessionId) {
                    createNewSession();
                } else {
                    loadSessions();
                }
            } catch (e) {
                console.error('删除会话失败:', e);
            }
        }
        
        // 格式化时间
        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('zh-CN', { 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }
        
        // 切换侧边栏（移动端）
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
        }
        
        // 获取元素
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const errorMessage = document.getElementById('error-message');
        
        // 设置输入框内容
        function setInput(text) {
            userInput.value = text;
            userInput.focus();
        }
        
        // 添加消息到聊天界面
        function addMessage(role, content) {
            // 移除欢迎消息
            const welcome = document.querySelector('.welcome-message');
            if (welcome) {
                welcome.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '🧑' : '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = formatContent(content);
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            
            // 滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // 格式化内容（支持换行和简单标记）
        function formatContent(text) {
            return text
                .replace(/\n/g, '<br>')
                .replace(/【(.+?)】/g, '<strong style="color: #667eea;">【$1】</strong>')
                .replace(/(\d+\..+?)(?=<br>|$)/g, '<div style="margin: 5px 0;">$1</div>');
        }
        
        // 显示/隐藏错误
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }
        
        // 发送消息
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            
            // 添加用户消息
            addMessage('user', message);
            userInput.value = '';
            
            // 显示思考中
            typingIndicator.classList.add('show');
            sendBtn.disabled = true;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        message: message
                    })
                });
                
                if (!response.ok) {
                    throw new Error('服务器响应错误');
                }
                
                const data = await response.json();
                
                // 添加助手回复
                if (data.response) {
                    addMessage('assistant', data.response);
                } else if (data.error) {
                    showError('错误: ' + data.error);
                }
                
            } catch (error) {
                console.error('Error:', error);
                showError('连接失败，请确保后端服务已启动 (python api/agent_api.py)');
            } finally {
                typingIndicator.classList.remove('show');
                sendBtn.disabled = false;
            }
        }
        
        // 监听回车键
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // 页面加载完成后聚焦输入框
        window.onload = function() {
            userInput.focus();
        };
    </script>
</body>
</html>
